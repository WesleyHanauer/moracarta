<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title data-i18n="TITLE"></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <audio
    id="bg-music"
    loop
    preload="auto"
    playsinline>
</audio>

  <button id="music-toggle" class="music-toggle" type="button" aria-label="Pause music">
    <img id="music-toggle-icon" src="../../assets/images/pause.png" alt="Pause music">
  </button>

  <div class="header">
    <div class="header-ornament">❧ ❦ ☙</div>
    <h1 data-i18n="TITLE"></h1>
    <div class="header-line"></div>
    <p class="header-sub love-note" data-variable="TEXT_TOP"></p>
  </div>

  <div class="letter-list" id="letter-list"></div>

  <div class="footer">
    <div class="footer-line"></div>
    <p data-variable="TEXT_BOTTOM"></p>
    <p data-variable="YOUR_NAME"></p>
  </div>

  <script type="module" src="../data/letters.js"></script>
  <script type="module" src="../scripts/main.script.js"></script>
  <script type="module" src="../scripts/data.variable.js"></script>
</html>
